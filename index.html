<!doctype html>
<!--
Hummingbird, real-time Three.js. Built for Vincent Strader from Theo Tillberg's
"12 / Feather" (Codevember 2026): https://github.com/ttillberg/codevember-2026/tree/main/12
Original live demo: https://ttillberg.github.io/codevember-2026/12/
Changes in this build: one offline file (perch model inlined), plus Animation speed,
Time of day, Slow camera drift and Performance mode controls in the settings card.
Added for Vincent (Nov 2026): synthesized bird sound (Web Audio, no audio files); two more
birds, an American robin (songbird) and an American goldfinch (finch), each with its own
flight. Their bodies and plumage use Theo Tillberg's own feather system from this project
(contour feathers, fuzz, flight feathers, plumage shader), re-shaped and re-coloured for each
species in this build (no third-party models or textures);
a bird picker; and the hummingbird now flies tours round the scene between hover points.
Added Nov 17, 2026: the perch is now Risk Rock's RISK tag (artwork by Kelly Graval, from
riskrock.com's "420 RISK Tag Special Drop"), used with the artist's permission through
Vincent Strader, cut as a 3D sculpture; and an ambient monarch butterfly, modeled and painted
in code for this build (no third-party models or textures). The tag artwork is NOT covered by
the MIT License below: all rights stay with Risk Rock.
